# Cost: converted from GreenPT's EUR list price at 1.14 USD/EUR (rate captured 2026-07-24).
# Retiring: since 2026-10-05 GreenPT answers minimax-m2.5 with minimax-m3 and bills its price.
# From 2026-11-05 requests return 400 Unsupported model. Source: https://docs.greenpt.ai/support/changelog
# Sources: https://docs.greenpt.ai/pricing and https://docs.greenpt.ai/model-cards
# reasoning_effort: the values below; "none" is refused because thinking cannot be turned off.
# Values verified against the production API. See https://docs.greenpt.ai/reasoning
# cache_read: discounted rate for cached prompt tokens. Cache writes are not
# charged. See https://docs.greenpt.ai/prompt-caching
base_model = "minimax/MiniMax-M2.5"
status = "deprecated"
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]
attachment = true
structured_output = true

[cost]
input = 0.5016
cache_read = 0.1254
output = 2.508

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text", "image"]
